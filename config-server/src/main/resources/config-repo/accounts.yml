server:
  port: 8082

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/accounts_db
    username: ${DB_USER:accounts_user}
    password: ${DB_PASSWORD:accounts_pass}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
kafka:
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  topic:
    notifications: ${KAFKA_TOPIC_NOTIFICATIONS:bank.notifications}

outbox:
  publish-delay: 5000
  max-attempts: 5
