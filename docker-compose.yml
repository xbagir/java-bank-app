services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.3.2
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8180
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "8180:8080"
    volumes:
      - ./docker/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro

  kafka:
    image: apache/kafka:3.9.0
    hostname: kafka
    ports:
      - "9092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_HOST://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data

  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      - kafka
    entrypoint: ["/bin/bash", "-c"]
    command: >
      until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1;
      do sleep 2; done;
      /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server kafka:9092
      --topic bank.notifications --partitions 3 --replication-factor 1

  discovery-server:
    build:
      context: .
      dockerfile: discovery-server/Dockerfile
    ports:
      - "8761:8761"

  config-server:
    build:
      context: .
      dockerfile: config-server/Dockerfile
    ports:
      - "8888:8888"
    depends_on:
      - discovery-server

  notifications:
    build:
      context: .
      dockerfile: notifications/Dockerfile
    environment: &service-env
      DB_HOST: postgres
      DB_PORT: 5432
      EUREKA_URL: http://discovery-server:8761/eureka/
      CONFIG_SERVER_URL: http://config-server:8888
      KEYCLOAK_ISSUER: http://localhost:8180/realms/bank
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/bank/protocol/openid-connect/certs
      KEYCLOAK_TOKEN_URI: http://keycloak:8080/realms/bank/protocol/openid-connect/token
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC_NOTIFICATIONS: bank.notifications
      KAFKA_CONSUMER_GROUP_ID: bank-notifications
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      discovery-server:
        condition: service_started
      config-server:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully

  accounts:
    build:
      context: .
      dockerfile: accounts/Dockerfile
    environment:
      <<: *service-env
      DB_USER: accounts_user
      DB_PASSWORD: accounts_pass
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      discovery-server:
        condition: service_started
      config-server:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully

  cash:
    build:
      context: .
      dockerfile: cash/Dockerfile
    environment:
      <<: *service-env
      DB_USER: cash_user
      DB_PASSWORD: cash_pass
      CASH_CLIENT_SECRET: cash-secret
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully

  transfer:
    build:
      context: .
      dockerfile: transfer/Dockerfile
    environment:
      <<: *service-env
      DB_USER: transfer_user
      DB_PASSWORD: transfer_pass
      TRANSFER_CLIENT_SECRET: transfer-secret
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    environment:
      EUREKA_URL: http://discovery-server:8761/eureka/
      CONFIG_SERVER_URL: http://config-server:8888
      KEYCLOAK_ISSUER: http://localhost:8180/realms/bank
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/bank/protocol/openid-connect/certs
    ports:
      - "8081:8081"
    depends_on:
      discovery-server:
        condition: service_started
      config-server:
        condition: service_started

  front:
    build:
      context: .
      dockerfile: front/Dockerfile
    environment:
      EUREKA_URL: http://discovery-server:8761/eureka/
      CONFIG_SERVER_URL: http://config-server:8888
      FRONT_CLIENT_SECRET: front-secret
      KEYCLOAK_AUTHORIZATION_URI: http://localhost:8180/realms/bank/protocol/openid-connect/auth
      KEYCLOAK_TOKEN_URI: http://keycloak:8080/realms/bank/protocol/openid-connect/token
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/bank/protocol/openid-connect/certs
      KEYCLOAK_USERINFO_URI: http://keycloak:8080/realms/bank/protocol/openid-connect/userinfo
      KEYCLOAK_END_SESSION_URI: http://localhost:8180/realms/bank/protocol/openid-connect/logout
      GATEWAY_BASE_URL: http://gateway
    ports:
      - "8080:8080"
    depends_on:
      gateway:
        condition: service_started
      keycloak:
        condition: service_started

volumes:
  postgres-data:
  kafka-data:
