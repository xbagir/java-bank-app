spring:
  config:
    import: ""
  cloud:
    config:
      enabled: false
    discovery:
      enabled: false
  security:
    oauth2:
      client:
        registration:
          keycloak:
            provider: keycloak
            client-id: front
            client-secret: front-secret
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid,accounts.read,accounts.write,cash.write,transfer.write
        provider:
          keycloak:
            authorization-uri: http://localhost:8180/realms/bank/protocol/openid-connect/auth
            token-uri: http://localhost:8180/realms/bank/protocol/openid-connect/token
            jwk-set-uri: http://localhost:8180/realms/bank/protocol/openid-connect/certs
            user-info-uri: http://localhost:8180/realms/bank/protocol/openid-connect/userinfo
            end-session-endpoint: http://localhost:8180/realms/bank/protocol/openid-connect/logout
            user-name-attribute: preferred_username

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false
