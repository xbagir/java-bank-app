server:
  port: 8081

spring:
  application:
    name: gateway
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/bank}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/bank/protocol/openid-connect/certs}
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        - id: accounts
          uri: lb://accounts
          predicates:
            - Path=/api/accounts/**
          filters:
            - StripPrefix=1
            - name: CircuitBreaker
              args:
                name: accountsCircuitBreaker
                fallbackUri: forward:/fallback/accounts
        - id: cash
          uri: lb://cash
          predicates:
            - Path=/api/cash/**
          filters:
            - StripPrefix=1
            - name: CircuitBreaker
              args:
                name: cashCircuitBreaker
                fallbackUri: forward:/fallback/cash
        - id: transfer
          uri: lb://transfer
          predicates:
            - Path=/api/transfer/**
          filters:
            - StripPrefix=1
            - name: CircuitBreaker
              args:
                name: transferCircuitBreaker
                fallbackUri: forward:/fallback/transfer
        - id: notifications
          uri: lb://notifications
          predicates:
            - Path=/api/notifications/**
          filters:
            - StripPrefix=1
            - name: CircuitBreaker
              args:
                name: notificationsCircuitBreaker
                fallbackUri: forward:/fallback/notifications

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info
