spring:
  config:
    import: ""
  cloud:
    config:
      enabled: false
    discovery:
      enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/bank
          jwk-set-uri: http://localhost:8180/realms/bank/protocol/openid-connect/certs

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false
