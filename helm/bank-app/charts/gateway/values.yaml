replicas: 1
image:
  repository: bank-app-gateway
  tag: "1.0.0"
  pullPolicy: IfNotPresent
service:
  enabled: true
  port: 8081
config:
  SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
  EUREKA_URL: http://discovery-server:8761/eureka/
  CONFIG_SERVER_URL: http://config-server:8888
  KEYCLOAK_ISSUER: http://localhost:8180/realms/bank
  KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/bank/protocol/openid-connect/certs
