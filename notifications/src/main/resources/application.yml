spring:
  application:
    name: notifications
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/notifications_db
    username: ${DB_USER:notifications_user}
    password: ${DB_PASSWORD:notifications_pass}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

kafka:
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  topic:
    notifications: ${KAFKA_TOPIC_NOTIFICATIONS:bank.notifications}
  consumer:
    group-id: ${KAFKA_CONSUMER_GROUP_ID:bank-notifications}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info
